[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cng-toolbox"
version = "0.1.0"
description = "草泥鸽工具箱 — Windows 桌面工具箱：截图置顶 / 粘贴板 / 取色器"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cngBOX" }]
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
cng-toolbox = "cng_toolbox.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
